# Supabase CLI config (used by `supabase functions deploy` / `supabase start`).
project_id = "my-voice-life"

[functions.process-voice]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Billing: the public "prices" action must work without a session; "checkout"/"portal" check the
# user's JWT inside the function. Stripe can't send a Supabase JWT: the webhook is authenticated
# by its Stripe-Signature instead (verified in code against STRIPE_WEBHOOK_SECRET).
[functions.billing]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
