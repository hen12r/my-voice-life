<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1230" />
  <title>Offline · My Voice Life</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <style>
    :root { color-scheme: light dark; --bg: #f6f6fa; --card: #ffffff; --ink: #0b1230; --muted: #5b6178; --accent: #6f4ef0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1230; --card: #141c3d; --ink: #f1f2f8; --muted: #a8adc4; --accent: #a28bff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
      font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 32px 28px; text-align: center;
      box-shadow: 0 10px 30px rgba(11, 18, 48, 0.08); }
    img { width: 56px; height: 56px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 8px; font-size: 0.95rem; }
    a { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 12px; background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" />
    <h1>You’re offline</h1>
    <p>My Voice Life needs an internet connection to load and save your notes, tasks and recordings.</p>
    <p>Nothing has been lost: everything you saved is stored in your account.</p>
    <a href="/app">Try again</a>
    <p lang="fr" style="margin-top:20px;font-size:0.85rem">Vous êtes hors ligne. Reconnectez-vous puis réessayez.</p>
  </main>
</body>
</html>
