# iOS app (Capacitor). Two jobs:
#  1. simulator-build: proves the app compiles for iOS (unsigned Simulator build). Runs when iOS files
#     change, or by hand. Uses mock Supabase values: nothing real is contacted.
#  2. testflight: signed build uploaded to TestFlight. OFF until the responsible adult has an Apple
#     Developer account and sets repository variable IOS_TESTFLIGHT_ENABLED=true plus the secrets
#     listed in docs/IOS_APP_STORE.md. Manual trigger only. macOS minutes cost 10× Linux minutes.
name: iOS
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also upload a signed build to TestFlight (needs the Apple secrets)'
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths: ['ios/**', 'capacitor.config.ts', '.github/workflows/ios.yml', 'src/native/**']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the web app (mock backend values, never real ones)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mockproj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mockkey123
      - run: npx cap sync ios
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && vars.IOS_TESTFLIGHT_ENABLED == 'true'
    needs: simulator-build
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight   # lets the owner require a manual approval in GitHub before each upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the web app (real public Supabase values, from repository variables)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync ios
      - name: App Store Connect API key (from secrets; deleted at the end of the job)
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      - name: Archive (automatic signing with the API key)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ vars.IOS_BUNDLE_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
